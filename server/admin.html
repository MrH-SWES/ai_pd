<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop facilitator</title><link rel="stylesheet" href="/styles.css"><body><main style="max-width:900px;margin:3rem auto;padding:1rem"><a href="/">← Workshop</a><h1>Facilitator desk</h1><p>Post shared notes and review attendee questions. Do not include student names or other identifying details.</p><p id="status" role="status"></p><form id="entry"><label>Section<select name="kind"><option value="note">Running notes</option><option value="parking">Parking lot</option><option value="step">Next steps</option></select></label><label>Heading<input name="title" maxlength="200"></label><label>Note<textarea name="body" maxlength="8000" required></textarea></label><button>Post note</button></form><h2>Question queue</h2><section id="queue"></section></main><script>
const status=document.getElementById('status'),queue=document.getElementById('queue');async function request(path,data,method='POST'){const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x;}async function refresh(){try{const r=await fetch('/api/admin',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);queue.replaceChildren();for(const q of d.questions){const card=document.createElement('article');card.className='record';const title=document.createElement('h3');title.textContent=q.question;const tag=document.createElement('p');tag.textContent=q.status;const answer=document.createElement('textarea');answer.value=q.answer;answer.placeholder='Answer';answer.maxLength=8000;card.append(title,tag,answer);for(const [s,label] of [['published','Publish question'],['answered','Publish answer'],['hidden','Hide']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await request('/api/admin/questions/'+q.id,{status:s,answer:answer.value},'PATCH');await refresh();}catch(e){status.textContent=e.message;b.disabled=false;}};card.append(b);}queue.append(card);}status.textContent='Queue loaded.';}catch(e){status.textContent=e.message;}}document.getElementById('entry').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await request('/api/admin/entries',Object.fromEntries(new FormData(e.target)));e.target.reset();status.textContent='Note published.';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};refresh();
</script></body></html>
