<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf8"><meta name="description" content="Workshop notes and questions."><title>Workshop notes & questions</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><a class="skip" href="#notes">Skip to notes</a><header><h1>Workshop</h1><p>November 3, 2026</p></header>
<main>
<section id="notes" aria-labelledby="notes-title"><h2 id="notes-title">Notes</h2><div id="notes-list"><p class="empty">Notes will appear here.</p></div><p id="sync-status" class="status">Preview. Live updates are not connected.</p></section>
<section id="questions" aria-labelledby="questions-title"><h2 id="questions-title">Questions</h2><form id="question-form"><label class="sr-only" for="question">Your question</label><textarea id="question" name="question" maxlength="1200" rows="3" required placeholder="Ask a question…"></textarea><div class="honeypot" aria-hidden="true"><label for="website">Leave blank</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><div class="submit-row"><p>No names or student details, please.</p><button type="submit" id="submit-question">Send</button></div><p id="submission-status" class="status" role="status" aria-live="polite">Question submission is not connected yet.</p></form><div id="questions-list"><p class="empty">Published questions and answers will appear here.</p></div></section>
</main></body></html>
